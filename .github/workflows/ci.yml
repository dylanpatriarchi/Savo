name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (with -Wall -Wextra)
        run: make
      - name: Run the golden-file test suite
        run: make test

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under sanitizers
        run: make asan

  fuzz:
    name: fuzz smoke (advisory)
    runs-on: ubuntu-latest
    # Advisory: random input can produce a valid infinite loop that libFuzzer
    # reports as a timeout, so a failure here does not block the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the libFuzzer target
        run: make fuzz
      - name: Fuzz for 60s from a seed corpus
        run: |
          mkdir -p corpus
          cp tests/*.savo examples/*.savo corpus/ 2>/dev/null || true
          ./fuzz_savo -max_total_time=60 -timeout=10 -rss_limit_mb=2048 corpus
